<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Tap Counter</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      background: #020617;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 34rem);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(0.75rem, env(safe-area-inset-top))
               max(0.75rem, env(safe-area-inset-right))
               max(0.75rem, env(safe-area-inset-bottom))
               max(0.75rem, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 3.25rem;
    }

    .heading { min-width: 0; }

    h1 {
      margin: 0;
      font-size: 1.125rem;
      line-height: 1.4;
    }

    .status {
      margin: 0.1rem 0 0;
      color: #94a3b8;
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      flex-shrink: 0;
      gap: 0.5rem;
    }

    .control-button {
      min-height: 2.75rem;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0 1rem;
      background: #0f172a;
      color: #e2e8f0;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
    }

    .control-button:active { transform: scale(0.96); }
    .control-button:disabled { opacity: 0.4; cursor: default; }

    .cancel-button {
      display: none;
      width: 2.75rem;
      padding: 0;
      font-size: 1.25rem;
    }

    .reset-button.pending {
      border-color: #f87171;
      background: #ef4444;
      color: white;
    }

    .tap-button {
      flex: 1;
      min-height: 19rem;
      border: 0;
      border-radius: 2rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0ea5e9;
      color: white;
      box-shadow: 0 18px 60px rgba(14, 165, 233, 0.28);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 80ms ease, background 80ms ease;
    }

    .tap-button:active {
      transform: scale(0.985);
      background: #0284c7;
    }

    .count {
      max-width: 100%;
      overflow-wrap: anywhere;
      font-size: clamp(5rem, 28vw, 10rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 0.9;
      letter-spacing: -0.06em;
    }

    .tap-label {
      margin-top: 1.5rem;
      border-radius: 999px;
      padding: 0.65rem 1.25rem;
      background: rgba(0, 0, 0, 0.15);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    button:focus-visible {
      outline: 4px solid rgba(125, 211, 252, 0.8);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="heading">
        <h1>Tap Counter</h1>
        <p class="status" id="status">Saved automatically on this device</p>
      </div>

      <div class="controls">
        <button class="control-button cancel-button" id="cancelButton" type="button" aria-label="Cancel reset">×</button>
        <button class="control-button reset-button" id="resetButton" type="button">Reset</button>
      </div>
    </header>

    <button class="tap-button" id="tapButton" type="button" aria-label="Increase counter">
      <span class="count" id="count" aria-live="polite" aria-atomic="true">0</span>
      <span class="tap-label">Tap anywhere</span>
    </button>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "phone-tap-counter";
      const CONFIRMATION_MS = 4000;

      const countElement = document.getElementById("count");
      const statusElement = document.getElementById("status");
      const tapButton = document.getElementById("tapButton");
      const resetButton = document.getElementById("resetButton");
      const cancelButton = document.getElementById("cancelButton");

      let count = 0;
      let resetPending = false;
      let resetTimer = null;

      try {
        const saved = Number(localStorage.getItem(STORAGE_KEY));
        if (Number.isFinite(saved) && saved >= 0) count = saved;
      } catch (_) {}

      function save() {
        try { localStorage.setItem(STORAGE_KEY, String(count)); } catch (_) {}
      }

      function render() {
        countElement.textContent = String(count);
        tapButton.setAttribute("aria-label", `Increase counter. Current count: ${count}`);
        resetButton.disabled = count === 0;
        resetButton.textContent = resetPending ? "Confirm reset" : "Reset";
        resetButton.classList.toggle("pending", resetPending);
        resetButton.setAttribute("aria-label", resetPending ? "Confirm reset counter" : "Reset counter");
        cancelButton.style.display = resetPending ? "block" : "none";
        statusElement.textContent = resetPending
          ? "Tap reset again within 4 seconds"
          : "Saved automatically on this device";
      }

      function cancelReset() {
        resetPending = false;
        if (resetTimer !== null) {
          clearTimeout(resetTimer);
          resetTimer = null;
        }
        render();
      }

      tapButton.addEventListener("click", () => {
        if (resetPending) cancelReset();
        count += 1;
        save();
        render();
      });

      resetButton.addEventListener("click", () => {
        if (count === 0) return;

        if (resetPending) {
          count = 0;
          save();
          cancelReset();
          return;
        }

        resetPending = true;
        resetTimer = window.setTimeout(cancelReset, CONFIRMATION_MS);
        render();
      });

      cancelButton.addEventListener("click", cancelReset);

      // Prevent Safari's double-tap gesture from zooming while retaining normal button taps.
      let lastTouchEnd = 0;
      document.addEventListener("touchend", (event) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      render();
    })();
  </script>
</body>
</html>
